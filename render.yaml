# Render service definition for the Translog demonstration.
#
# The application is unchanged: this file only states how Render should build
# and start the server it already had. Everything account-specific — the Gmail
# addresses, the OpenRouter key, the OAuth tokens — is supplied as environment
# variables or secret files in the Render dashboard, never here and never in
# the repository.
#
# Three settings are not optional, and are the reason this file exists at all:
#   HOST                    Render routes to the container's external interface,
#                           not to loopback, so the server must bind 0.0.0.0.
#   TRANSLOG_ALLOWED_HOSTS  The cross-site guard refuses any state-changing POST
#                           whose Host is not declared. Without the service's own
#                           hostname here the page loads and every button 403s.
#   TRANSLOG_DASHBOARD_TOKEN The dashboard password. Because HOST is non-loopback,
#                           --live refuses to start without it, rather than serve
#                           real client data and the approval controls openly.
services:
  - type: web
    name: translog-demo
    runtime: python
    plan: starter
    buildCommand: "pip install '.[api]'"
    startCommand: python -m translog_quote.interface.web --live
    # Liveness only — never /health/ready. /health returns immediately and
    # touches nothing external; /health/ready pings Upstash Redis (browser mode)
    # and can take seconds when the broker is slow, so pointing the platform
    # health check at it would let a slow Redis restart the whole web service.
    healthCheckPath: /health
    # The demonstration's durable state. Without a disk Render's filesystem is
    # wiped on every deploy and every restart, and a request waiting on a client
    # reply — the one thing in this workflow that deliberately outlives the
    # process that started it — would disappear between the clarification going
    # out and the answer coming back.
    #
    # A disk pins the service to one instance and disables zero-downtime
    # deploys. Both are correct here: the session is per-process and holds the
    # approval gate, so a second instance would answer with a different view of
    # what is awaiting approval.
    disk:
      name: translog-state
      mountPath: /var/lib/translog
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: HOST
        value: 0.0.0.0
      # Must equal the service's public hostname, e.g. translog-demo.onrender.com
      - key: TRANSLOG_ALLOWED_HOSTS
        sync: false
      # The dashboard password. Required here because this service binds a
      # non-loopback address (HOST above): --live refuses to start without it
      # rather than serve real client data and a working "approve and send"
      # button to anyone who knows the URL. Set a strong shared secret; operators
      # sign in through the browser's Basic-auth prompt (any username, this value
      # as the password). The Host allowlist stops a cross-origin browser; this
      # stops anyone who simply knows the URL.
      - key: TRANSLOG_DASHBOARD_TOKEN
        sync: false
      - key: TRANSLOG_OPENROUTER__API_KEY
        sync: false
      - key: TRANSLOG_GMAIL__TEST_ADDRESS
        sync: false
      - key: TRANSLOG_GMAIL__SENDER_ADDRESS
        sync: false
      - key: TRANSLOG_GMAIL__APPROVER_ADDRESS
        sync: false
      - key: TRANSLOG_GMAIL__SEND_ENABLED
        value: "true"
      # Uploaded in the dashboard as Secret Files; Render mounts them here.
      - key: TRANSLOG_GMAIL__TOKEN_PATH
        value: /etc/secrets/gmail_token.json
      - key: TRANSLOG_GMAIL__SEND_TOKEN_PATH
        value: /etc/secrets/gmail_send_token.json
      - key: TRANSLOG_GMAIL__QUERY
        value: 'in:inbox -subject:"[TRANSLOG INTERNAL]"'
      - key: TRANSLOG_GMAIL__MAX_RESULTS
        value: "5"
      # The shared managed Redis (Upstash, TLS, DB 0) that joins this dashboard
      # to the single Fedora browser worker when MODE is browser. Unused in demo
      # mode. The value is a secret set in the Render dashboard (a rediss://…/0
      # URL) and never written here — it must be the SAME endpoint, DB 0, and
      # rate-search queue the Fedora worker's .env.worker uses. This dashboard
      # only enqueues and polls jobs; it never runs a browser and needs no
      # WebCargo credentials.
      - key: TRANSLOG_QUEUE__REDIS_URL
        sync: false
      # Rates stay simulated and disclosed. The real adapter refuses anyway.
      # browser mode: this dashboard ENQUEUES each rate search onto the shared
      # Redis queue (TRANSLOG_QUEUE__REDIS_URL above) for the separately-run
      # Fedora browser worker to run on live WebCargo, then polls the result. It
      # runs no browser itself and needs no WebCargo credentials. It depends on
      # the worker being live and the Redis URL being set; if the worker is
      # offline the search stays queued (and the dashboard says so) — browser
      # mode never falls back to simulated data.
      - key: TRANSLOG_WEBCARGO__MODE
        value: browser
      # WebCargo's Goods Type is a controlled field decided BEFORE enqueue (the
      # reviewed General Cargo rule or an operator pick) — never the client's
      # free-text commodity. Set GENERAL_CARGO_LABEL to the EXACT label from
      # WebCargo's live Goods Type dropdown; the adapter fails loudly if it does
      # not match, so a wrong value never silently mis-selects.
      - key: TRANSLOG_GOODS_TYPE__GENERAL_CARGO_LABEL
        value: "0000 - General Cargo"
      # JSON arrays. A populated SPECIAL_HANDLING turns the automatic General
      # Cargo rule ON: a clear General Cargo / Non-Haz enquiry auto-resolves to
      # GENERAL_CARGO_LABEL, while a special-handling word (whole-word match on
      # the commodity), a chemical, or any non-general cargo_type is held for an
      # operator pick. CATALOG is the operator's pick list — every entry MUST be
      # an EXACT live WebCargo label (the adapter selects on equality and fails
      # loudly); General Cargo is always offered even if absent. Only labels
      # confirmed against the live dropdown are listed here; extend CATALOG only
      # with labels captured from the real dropdown. See
      # docs/webcargo-operator-auth.md.
      - key: TRANSLOG_GOODS_TYPE__CATALOG
        value: '["0000 - General Cargo","0000-90 - Vulnerable cargo"]'
      - key: TRANSLOG_GOODS_TYPE__SPECIAL_HANDLING
        value: '["battery","lithium","airbag","perfume","fresh","frozen","chilled","perishable","pharma","medicine","vaccine","live","animal","gold","jewel","valuable","dry ice","magnet","aerosol"]'
      # On the persistent disk declared above, not in the ephemeral container
      # filesystem. A subdirectory of the mount rather than the mount itself,
      # so the disk's own lost+found sits beside the state rather than inside
      # the directory the store enumerates. Created on first write.
      - key: TRANSLOG_DEMO__STATE_DIR
        value: /var/lib/translog/state
      # Operations mode: a restart (every deploy redeploys this service) must
      # NOT start a fresh demonstration. Non-terminal requests are restored from
      # the store above and the mail cutoff is the last successful poll, so a
      # deploy neither empties the dashboard nor drops mail that arrived during
      # it. Starting a fresh demonstration stays an explicit operator action.
      - key: TRANSLOG_DEMO__STARTUP_MODE
        value: operations
      # The first mail cutoff, used ONLY until the first successful poll writes a
      # watermark to the disk. Required in operations mode when no watermark
      # exists yet (a fresh disk, or the first deploy onto this change): the
      # service refuses to start without it rather than defaulting the cutoff to
      # "now" and silently skipping every earlier message. Set it in the Render
      # dashboard to an ISO 8601 instant (e.g. 2026-09-16T00:00:00+00:00) — the
      # moment from which mail should be read. Ignored once a watermark exists,
      # so it is safe to leave set.
      - key: TRANSLOG_DEMO__OPERATIONS_SINCE
        sync: false
