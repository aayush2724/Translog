[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "translog-quote"
version = "0.1.0"
description = "AI-assisted cargo quotation workflow — demonstration / proof of concept"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Canonical schemas, value objects, and strict validation of model output.
    "pydantic>=2.9",
    # Environment-backed configuration. Companion to pydantic for settings.
    "pydantic-settings>=2.5",
    # One POST to one endpoint, but with timeouts, a clean exception taxonomy to
    # translate, and no vendor SDK dragged in behind it.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "ruff>=0.6",
]
# Only for the one-time `gmail-auth` consent command (Phase 10.3). The runtime
# Gmail adapter needs nothing beyond httpx; this stays out of the core deps.
gmail = [
    "google-auth-oauthlib>=1.2",
]
# The asynchronous rate-search API service. A separate process from the
# browser worker, joined only by the Redis queue.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "redis>=5.0",
    "rq>=1.16",
]
# The browser worker: one queue consumer owning one persistent headless
# Chromium with an authenticated WebCargo session. Deliberately not part of
# the core install — the demo and the tests need none of it, and every import
# of these packages is lazy so a clean checkout still imports everywhere.
worker = [
    "redis>=5.0",
    "rq>=1.16",
    "playwright>=1.47",
]
# The model-extraction evaluation harness: it reads labelled client PDFs and
# scores extraction output against them. Dev/eval tooling only — never imported
# by the runtime, and its one `pypdf` use is lazy, so a core checkout still
# imports the module (only `read_pdf_text` needs the extra installed).
eval = [
    "pypdf>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/translog_quote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "phase2: awaits Phase 2 (extraction, ingestion, validation)",
    "phase3: awaits Phase 3 (rate pipeline)",
    "phase4: awaits Phase 4 (mock WebCargo adapter)",
    "live: calls a real external API; skipped unless credentials are configured",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["translog_quote"]
strict = true
warn_unreachable = true

# Optional dependency, imported inside one function of the one-time Gmail
# consent command and absent from a normal install. Its absence must not fail
# a type check of the runtime code, which does not import it at all.
[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*"]
ignore_missing_imports = true

# The API/worker/eval optional dependencies, absent from a core install for the
# same reason. All runtime imports of these are lazy; their absence must not
# fail a type check of code paths that never reach them.
[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*", "redis.*", "rq.*", "playwright.*", "pypdf.*"]
ignore_missing_imports = true

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "TCH"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so its models' imports must stay at
# module scope. Protocols are listed for the same reason: keeping port contracts
# readable as six-line files beats hiding their types behind TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "typing.Protocol"]

[tool.ruff.lint.per-file-ignores]
# A test's imports are read as part of the test. Hiding `pytest` or `Path`
# behind a TYPE_CHECKING guard because they happen to appear only in
# annotations makes the file harder to read for no runtime benefit — the same
# reasoning already applied to `ports/` below.
"tests/**" = ["S101", "TC001", "TC002", "TC003"]
# The failure taxonomy names outcomes, not "Errors": ContractViolation and
# UnresolvedLocation say what went wrong far better than an -Error suffix.
"src/translog_quote/errors/taxonomy.py" = ["N818"]
# Same reasoning: `NotADecision` says what went wrong at the raise site far
# better than `NotADecisionError`, and reads as the sentence it is.
"src/translog_quote/domain/quotation/decide.py" = ["N818"]
# And `IncompatibleService`, for the same reason again.
"src/translog_quote/domain/quotation/compose.py" = ["N818"]
# And `UndeterminableTransit`: the raise site reads "this provider data does not
# determine a transit", which is precisely the outcome a caller acts on.
"src/translog_quote/domain/rates/transit.py" = ["N818"]
# Ports are the project's published contracts and are read far more often than
# they are imported. Hiding their types behind TYPE_CHECKING to save an import
# makes a six-line interface harder to read for no runtime benefit.
"src/translog_quote/ports/*.py" = ["TC001", "TC003"]
"src/translog_quote/domain/conversation/model.py" = ["TC001"]
