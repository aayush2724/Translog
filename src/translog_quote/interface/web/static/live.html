<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Translog Express — Quotation Desk (Live)</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/live.css">
  <script src="/live.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">TE</span>
      <span class="brand-text">
        <span class="brand-name">Translog Express</span>
        <span class="brand-sub">Quotation Desk</span>
      </span>
    </div>
    <!-- The one status the operator needs: whether the desk is watching the
         mailbox. It turns amber when the background poll is failing, so a
         dashboard that has quietly stopped receiving work says so. -->
    <p id="live-indicator" class="live" role="status" aria-live="polite">
      <span class="live-dot" aria-hidden="true"></span><span id="live-label">Live</span>
    </p>
  </header>

  <p id="busy-banner" class="busy-banner" role="status" aria-live="polite" hidden></p>
  <!-- Outside both views on purpose: an action can fail from either one,
       and the banner that says so used to live in the detail view only. -->
  <p id="action-error" class="banner banner-amber" role="alert" aria-live="assertive" hidden></p>

  <main class="container">
    <section id="view-dashboard">
      <div id="page-head" class="page-head" hidden>
        <h1>Quotation requests</h1>
      </div>
      <div id="dashboard-list"></div>
    </section>

    <section id="view-detail" hidden>
      <nav class="crumbs">
        <button id="btn-back" class="linklike" type="button">&larr; All requests</button>
      </nav>
      <div id="detail-header"></div>
      <div class="detail-grid">
        <ol class="timeline-steps" id="timeline"></ol>
        <div id="sections"></div>
      </div>
    </section>

    <p id="load-error" class="load-error" hidden>
      Could not reach the demo server. Start it with:
      <code>python -m translog_quote.interface.web --live</code>
    </p>
  </main>

  <!-- No page footer. On a short page it floated a rule and a disclaimer
       through the middle of the screen. The simulated-rate disclosure is not
       lost with it: it is rendered beside every simulated figure, which is
       where somebody deciding on a price has to see it. -->
</body>
</html>
